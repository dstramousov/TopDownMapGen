[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "top-down-worldgen"
version = "0.0.2"
description = "Seed-based procedural map generator for top-down games."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Dimas" }
]
keywords = [
    "procedural-generation",
    "map-generator",
    "top-down",
    "game-development",
    "tiled",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Pillow>=10.0,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
generate-world = "top_down_worldgen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["top_down_worldgen*"]

[tool.setuptools.package-data]
top_down_worldgen = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["top_down_worldgen", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "PL",
    "RUF",
]
ignore = [
    "PLR0913",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "PLR2004",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true
mypy_path = "."

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
source = ["top_down_worldgen"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.top_down_worldgen]
default_config = "configs/default.json"
default_output = "out/generated_map.json"
default_render_tile_size = 16
