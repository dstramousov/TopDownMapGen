[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "top-down-worldgen"
version = "0.0.14"
description = "Seed-based procedural map generator for top-down games."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
generate-world = "top_down_worldgen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["top_down_worldgen*"]

[tool.setuptools.package-data]
top_down_worldgen = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["top_down_worldgen", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
